server:
  port: 8080

spring:
  application:
    name: gestion-obra

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionobra}
    username: ${DB_USER:gestionobra}
    password: ${DB_PASSWORD:gestionobra}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  url: ${APP_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-responder@gestionobra.local}
  storage:
    tipo: ${STORAGE_TIPO:local}
    directorio: ${STORAGE_DIRECTORIO:./archivos}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:comprobantes}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
