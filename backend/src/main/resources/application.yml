server:
  port: 8080
  servlet:
    session:
      # Vencimiento por inactividad; el límite absoluto está en app.sesion
      timeout: ${SESION_INACTIVIDAD:30m}
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SEGURA:false}

spring:
  application:
    name: gestion-obra

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionobra}
    username: ${DB_USER:gestionobra}
    password: ${DB_PASSWORD:gestionobra}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 10MB
      # Hasta 5 comprobantes de 10 MB cada uno
      max-request-size: 52MB

app:
  url: ${APP_URL:http://localhost:3000}
  sesion:
    limite-absoluto: ${SESION_LIMITE_ABSOLUTO:8h}
  # Cuenta del arquitecto que se crea al arrancar con la base vacía
  arquitecto:
    nombre: ${ARQUITECTO_NOMBRE:Arquitecto Demo}
    email: ${ARQUITECTO_EMAIL:arquitecto@gestionobra.local}
    clave: ${ARQUITECTO_CLAVE:obra-demo-local-2026}
  mail:
    from: ${MAIL_FROM:no-responder@gestionobra.local}
  storage:
    tipo: ${STORAGE_TIPO:local}
    directorio: ${STORAGE_DIRECTORIO:./archivos}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:comprobantes}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
