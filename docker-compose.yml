services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gestionobra}
      POSTGRES_USER: ${DB_USER:-gestionobra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestionobra}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestionobra} -d ${DB_NAME:-gestionobra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gestionobra}
      DB_USER: ${DB_USER:-gestionobra}
      DB_PASSWORD: ${DB_PASSWORD:-gestionobra}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-responder@gestionobra.local}
      STORAGE_TIPO: ${STORAGE_TIPO:-local}
      STORAGE_DIRECTORIO: /app/archivos
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-comprobantes}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-false}
      ARQUITECTO_NOMBRE: ${ARQUITECTO_NOMBRE:-Arquitecto Demo}
      ARQUITECTO_EMAIL: ${ARQUITECTO_EMAIL:-arquitecto@gestionobra.local}
      ARQUITECTO_CLAVE: ${ARQUITECTO_CLAVE:-obra-demo-local-2026}
    ports:
      - "8080:8080"
    volumes:
      - archivos:/app/archivos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
  archivos:
